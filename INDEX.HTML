<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Vitória - Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .product-card { transition: all 0.3s; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; background: white; }
        .product-img { width: 100%; height: 120px; object-fit: cover; background: #f1f5f9; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
        #modal-cadastro, #modal-cardapio { display: none; }
        .btn-cardapio { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .loja-fechada-overlay { filter: grayscale(1); pointer-events: none; opacity: 0.6; }
        #texto-cardapio-view { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="pb-24">

    <div id="aviso-fechado" class="hidden bg-yellow-500 text-white text-[10px] font-bold text-center py-1 uppercase tracking-widest">
        ⚠️ Loja fechada no momento - Apenas consulta
    </div>

    <header class="bg-red-600 text-white p-5 sticky top-0 z-50 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter">RESTAURANTE VITÓRIA</h1>
            <p class="text-[10px] font-medium opacity-80 uppercase tracking-widest">Peça sua refeição aqui</p>
        </div>
        <button onclick="toggleCarrinho()" class="relative p-3 bg-red-700 rounded-2xl shadow-inner">
            <i class="fas fa-shopping-bag text-xl"></i>
            <span id="cart-count" class="cart-badge">0</span>
        </button>
    </header>

    <main class="p-4" id="main-content">
        <button onclick="abrirCardapio()" class="btn-cardapio w-full py-4 rounded-2xl text-white font-bold flex items-center justify-center gap-3 text-lg mb-8 active:scale-95 transition-transform">
            <i class="fas fa-utensils"></i> VEJA O CARDÁPIO DE HOJE
        </button>

        <h2 class="text-gray-800 font-black text-xl mb-4 flex items-center gap-2 uppercase italic">
            <span class="w-1.5 h-6 bg-red-600 rounded-full"></span> Nosso Cardápio
        </h2>

        <div id="lista-produtos" class="grid grid-cols-2 gap-3">
            <div class="col-span-2 text-center py-10 text-gray-400">Carregando...</div>
        </div>
    </main>

    <div id="modal-cardapio" class="fixed inset-0 bg-black bg-opacity-95 z-[100] flex flex-col items-center justify-center p-6">
        <button onclick="fecharCardapio()" class="absolute top-5 right-5 text-white text-4xl">&times;</button>
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl overflow-y-auto max-h-[80vh]">
            <h3 class="text-red-600 font-black text-xl mb-4 text-center uppercase italic border-b pb-2">Prato do Dia</h3>
            <div id="texto-cardapio-view" class="text-gray-700 text-lg leading-relaxed font-medium text-center italic">Carregando menu...</div>
            <button onclick="fecharCardapio()" class="w-full mt-6 bg-gray-100 py-3 rounded-xl font-bold text-gray-500 uppercase text-xs">Fechar</button>
        </div>
    </div>

    <div id="carrinho-view" class="fixed inset-0 bg-black bg-opacity-60 z-[60] hidden">
        <div class="absolute right-0 top-0 w-full max-w-[300px] h-full bg-white shadow-2xl flex flex-col">
            <div class="p-4 bg-red-600 text-white flex justify-between items-center">
                <h2 class="font-bold uppercase italic">Meu Pedido</h2>
                <button onclick="toggleCarrinho()" class="text-3xl">&times;</button>
            </div>
            <div id="itens-carrinho" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-5 border-t bg-gray-50">
                <div class="flex justify-between mb-4">
                    <span class="font-bold text-gray-500 uppercase text-xs">Total:</span>
                    <span id="total-carrinho" class="text-2xl font-black text-red-600 font-mono">R$ 0,00</span>
                </div>
                <button id="btn-finalizar-pedido" onclick="abrirCadastro()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg">FINALIZAR PEDIDO</button>
            </div>
        </div>
    </div>

    <div id="modal-cadastro" class="fixed inset-0 bg-black bg-opacity-80 z-[70] items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[30px] p-6 shadow-2xl">
            <h2 class="text-2xl font-black text-center text-gray-800 mb-6 uppercase italic">Entrega</h2>
            <div class="space-y-4">
                <input type="text" id="nome" placeholder="Seu Nome" class="w-full bg-gray-100 border-none p-4 rounded-2xl outline-none">
                <input type="text" id="endereco" placeholder="Endereço e Bairro" class="w-full bg-gray-100 border-none p-4 rounded-2xl outline-none">
                <input type="tel" id="whatsapp" placeholder="WhatsApp (DDD)" class="w-full bg-gray-100 border-none p-4 rounded-2xl outline-none">
            </div>
            <button onclick="enviarWhatsApp()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-black text-lg mt-8 flex items-center justify-center gap-2"><i class="fab fa-whatsapp text-2xl"></i> ENVIAR NO WHATSAPP</button>
            <button onclick="fecharCadastro()" class="w-full text-gray-400 mt-4 text-xs font-bold uppercase">Voltar</button>
        </div>
    </div>

    <a href="admin.html" class="fixed bottom-4 left-4 bg-gray-800 text-white px-3 py-2 rounded-full text-[10px] font-bold opacity-30 z-50">⚙️ ADMIN</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFfzdiaiNhDLilNUVG_o3LnX2U0ZQmrys",
            authDomain: "pdvcaixa-8c17e.firebaseapp.com",
            databaseURL: "https://pdvcaixa-8c17e-default-rtdb.firebaseio.com",
            projectId: "pdvcaixa-8c17e",
            storageBucket: "pdvcaixa-8c17e.firebasestorage.app",
            messagingSenderId: "394102472085",
            appId: "1:394102472085:web:3462ffc38d4b94723aca9c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let carrinho = [];
        let forcarFeijoada = false;
        const diaHoje = new Date().getDay();

        // Escutar Configurações (Loja e Feijoada Forçada)
        onValue(ref(db, 'config'), (snap) => {
            const cfg = snap.val() || {};
            forcarFeijoada = cfg.forcar_feijoada || false;
            
            const btn = document.getElementById('btn-finalizar-pedido');
            if (cfg.loja_aberta === false) {
                document.getElementById('aviso-fechado').classList.remove('hidden');
                btn.disabled = true; btn.classList.replace('bg-green-500', 'bg-gray-400');
                btn.innerText = "LOJA FECHADA";
            } else {
                document.getElementById('aviso-fechado').classList.add('hidden');
                btn.disabled = false; btn.classList.replace('bg-gray-400', 'bg-green-500');
                btn.innerText = "FINALIZAR PEDIDO";
            }
            carregarProdutos();
        });

        onValue(ref(db, 'config/texto_cardapio'), (snap) => {
            document.getElementById('texto-cardapio-view').innerText = snap.val() || "Atualizando menu...";
        });

        function carregarProdutos() {
            onValue(ref(db, 'produtos'), (snap) => {
                const data = snap.val();
                const container = document.getElementById('lista-produtos');
                container.innerHTML = "";
                for (let id in data) {
                    const p = data[id];
                    const nome = (p.nome || "").toLowerCase();
                    
                    // 1. NUNCA BUFFET
                    if (nome.includes("buffet")) continue;
                    // 2. NUNCA VIDRO
                    if (nome.includes("vidro")) continue;
                    // 3. REGRA FEIJOADA (Sábado OU Forçado pelo Admin)
                    if (nome.includes("feijoada")) {
                        if (!forcarFeijoada && diaHoje !== 6) continue;
                    }

                    const img = p.foto || p.imagem || 'https://via.placeholder.com/150?text=Vitoria';
                    container.innerHTML += `
                        <div class="product-card flex flex-col shadow-sm">
                            <img src="${img}" class="product-img" onerror="this.src='https://via.placeholder.com/150?text=Restaurante'">
                            <div class="p-3 flex flex-col flex-1 justify-between">
                                <h3 class="text-[10px] font-bold text-gray-700 uppercase mb-1 line-clamp-2">${p.nome}</h3>
                                <div>
                                    <p class="text-red-600 font-black text-sm mb-2 text-right">R$ ${parseFloat(p.preco).toFixed(2)}</p>
                                    <button onclick="addCarrinho('${p.nome}', ${p.preco})" class="w-full bg-red-50 text-red-600 py-2.5 rounded-xl text-[10px] font-black active:scale-95 transition-all">+ ADICIONAR</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }, { onlyOnce: true });
        }

        window.abrirCardapio = () => document.getElementById('modal-cardapio').style.display = 'flex';
        window.fecharCardapio = () => document.getElementById('modal-cardapio').style.display = 'none';
        window.toggleCarrinho = () => document.getElementById('carrinho-view').classList.toggle('hidden');
        window.addCarrinho = (nome, preco) => { carrinho.push({ nome, preco }); atualizarInterface(); };
        window.atualizarInterface = () => {
            document.getElementById('cart-count').innerText = carrinho.length;
            const itensDiv = document.getElementById('itens-carrinho');
            itensDiv.innerHTML = ""; let t = 0;
            carrinho.forEach((item, index) => {
                t += parseFloat(item.preco);
                itensDiv.innerHTML += `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl border border-gray-100">
                    <div class="max-w-[70%]"><p class="text-[9px] font-bold uppercase truncate">${item.nome}</p><p class="text-sm font-black text-red-600">R$ ${item.preco.toFixed(2)}</p></div>
                    <button onclick="removerItem(${index})" class="text-gray-300"><i class="fas fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('total-carrinho').innerText = `R$ ${t.toFixed(2)}`;
        };
        window.removerItem = (index) => { carrinho.splice(index, 1); atualizarInterface(); };
        window.abrirCadastro = () => { if(carrinho.length > 0) document.getElementById('modal-cadastro').style.display = 'flex'; };
        window.fecharCadastro = () => document.getElementById('modal-cadastro').style.display = 'none';
        window.enviarWhatsApp = () => {
            const n = document.getElementById('nome').value, e = document.getElementById('endereco').value, w = document.getElementById('whatsapp').value;
            if(!n || !e || !w) return alert("Preencha tudo!");
            let msg = `*RESTAURANTE VITÓRIA - PEDIDO*\n\n👤 *Cliente:* ${n}\n🏠 *Endereço:* ${e}\n\n🛒 *ITENS:*\n`;
            let t = 0; carrinho.forEach(i => { msg += `• ${i.nome} - R$ ${i.preco.toFixed(2)}\n`; t += i.preco; });
            msg += `\n💰 *TOTAL: R$ ${t.toFixed(2)}*`;
            window.open(`https://api.whatsapp.com/send?phone=41996278447&text=${encodeURIComponent(msg)}`, '_blank');
        };
    </script>
</body>
</html>
