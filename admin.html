<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Restaurante Vitória</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
        #painel-admin { display: none; }
        .card { background: white; border-radius: 30px; padding: 30px; shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN -->
    <div id="login-screen" class="card text-center w-full max-w-sm">
        <h1 class="text-xl font-black mb-6 uppercase tracking-tighter">Acesso Administrativo</h1>
        <input type="password" id="senha-input" placeholder="Senha" class="w-full bg-gray-100 p-4 rounded-2xl text-center mb-4 outline-none">
        <button onclick="verificarSenha()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-bold">ENTRAR</button>
    </div>

    <!-- PAINEL -->
    <div id="painel-admin" class="card w-full max-w-md overflow-hidden p-0">
        <div class="bg-red-600 p-6 text-white text-center relative">
            <button onclick="location.reload()" class="absolute left-4 top-6 opacity-50"><i class="fas fa-sign-out-alt"></i></button>
            <h2 class="font-black uppercase italic">Painel Restaurante Vitória</h2>
        </div>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-abrir" onclick="setLoja(true)" class="py-4 rounded-2xl font-black border-2 transition-all">ABERTA</button>
                <button id="btn-fechar" onclick="setLoja(false)" class="py-4 rounded-2xl font-black border-2 transition-all">FECHADA</button>
            </div>

            <button id="btn-feijoada" onclick="setFeijoada()" class="w-full py-4 rounded-2xl font-black border-2"></button>

            <hr>

            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase">Preço Carne Extra (R$)</label>
                <input type="number" id="valor-extra" step="0.01" class="w-full p-4 bg-gray-50 rounded-xl font-bold text-red-600">
            </div>

            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase">Carnes do Dia (Uma por linha)</label>
                <textarea id="carnes-hoje" rows="3" class="w-full p-4 bg-gray-50 rounded-xl text-sm italic outline-none focus:ring-2 focus:ring-red-500"></textarea>
            </div>

            <div>
                <label class="text-[10px] font-black text-gray-400 uppercase">Acompanhamentos (Uma por linha)</label>
                <textarea id="acompanhamentos-hoje" rows="4" class="w-full p-4 bg-gray-50 rounded-xl text-sm italic outline-none focus:ring-2 focus:ring-red-500"></textarea>
            </div>

            <button onclick="salvarTudo()" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black shadow-lg">SALVAR TUDO</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFfzdiaiNhDLilNUVG_o3LnX2U0ZQmrys",
            authDomain: "pdvcaixa-8c17e.firebaseapp.com",
            databaseURL: "https://pdvcaixa-8c17e-default-rtdb.firebaseio.com",
            projectId: "pdvcaixa-8c17e",
            storageBucket: "pdvcaixa-8c17e.firebasestorage.app",
            messagingSenderId: "394102472085",
            appId: "1:394102472085:web:3462ffc38d4b94723aca9c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let config = {};

        window.verificarSenha = () => {
            if(document.getElementById('senha-input').value === "tony1979") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('painel-admin').style.display = 'block';
                carregar();
            } else alert("Senha incorreta!");
        };

        function carregar() {
            onValue(ref(db, 'config'), (snap) => {
                config = snap.val() || {};
                document.getElementById('valor-extra').value = config.valor_carne_extra || 0;
                document.getElementById('carnes-hoje').value = config.carnes || "";
                document.getElementById('acompanhamentos-hoje').value = config.acompanhamentos || "";
                
                const btnA = document.getElementById('btn-abrir'), btnF = document.getElementById('btn-fechar');
                btnA.className = config.loja_aberta ? "py-4 rounded-2xl font-black bg-green-50 text-green-600 border-green-500" : "py-4 rounded-2xl font-black bg-gray-50 text-gray-300 border-gray-100";
                btnF.className = !config.loja_aberta ? "py-4 rounded-2xl font-black bg-red-50 text-red-600 border-red-500" : "py-4 rounded-2xl font-black bg-gray-50 text-gray-300 border-gray-100";
                
                const btnFei = document.getElementById('btn-feijoada');
                btnFei.innerText = config.forcar_feijoada ? "FEIJOADA HOJE: SIM" : "FEIJOADA HOJE: NÃO";
                btnFei.className = config.forcar_feijoada ? "w-full py-4 rounded-2xl font-black bg-orange-500 text-white border-orange-600" : "w-full py-4 rounded-2xl font-black bg-white text-orange-500 border-orange-100";
            });
        }

        window.setLoja = (s) => set(ref(db, 'config/loja_aberta'), s);
        window.setFeijoada = () => set(ref(db, 'config/forcar_feijoada'), !config.forcar_feijoada);
        window.salvarTudo = () => {
            set(ref(db, 'config'), {
                ...config,
                valor_carne_extra: parseFloat(document.getElementById('valor-extra').value) || 0,
                carnes: document.getElementById('carnes-hoje').value,
                acompanhamentos: document.getElementById('acompanhamentos-hoje').value
            }).then(() => alert("Atualizado!"));
        };
    </script>
</body>
</html>
