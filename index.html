<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Vitória - Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .product-card { border-radius: 20px; border: 1px solid #e2e8f0; background: white; overflow: hidden; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .item-box { border: 2px solid #f1f5f9; border-radius: 15px; padding: 10px; text-align: center; background: #fff; transition: 0.3s; }
        .item-box.selecionado { border-color: #ef4444; background: #fef2f2; }
        .btn-add { background: #f1f5f9; color: #64748b; font-weight: 800; font-size: 9px; padding: 8px; border-radius: 10px; width: 100%; margin-top: 5px; }
        .selecionado .btn-add { background: #ef4444; color: #fff; }
        #modal-montar, #modal-cadastro, #modal-cardapio { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-up { animation: slideUp 0.3s ease-out; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-red-600 text-white p-5 sticky top-0 z-50 shadow-lg flex justify-between items-center text-center">
        <h1 class="text-xl font-black italic uppercase tracking-tighter w-full text-center">RESTAURANTE VITÓRIA</h1>
        <button onclick="toggleCarrinho()" class="absolute right-5 p-3 bg-red-700 rounded-xl">
            <i class="fas fa-shopping-basket text-xl"></i>
            <span id="cart-count" class="cart-badge">0</span>
        </button>
    </header>

    <main class="p-4">
        <button onclick="abrirCardapio()" class="w-full py-4 rounded-2xl bg-red-600 text-white font-bold mb-8 shadow-xl">
            <i class="fas fa-utensils"></i> VEJA O CARDÁPIO DE HOJE
        </button>
        <div id="lista-produtos" class="grid grid-cols-2 gap-3"></div>
    </main>

    <div id="modal-montar" class="fixed inset-0 bg-black bg-opacity-80 z-[110] flex items-end justify-center">
        <div class="bg-white w-full rounded-t-[40px] p-6 animate-up overflow-y-auto max-h-[95vh]">
            <div class="w-10 h-1 bg-gray-200 mx-auto mb-4 rounded-full"></div>
            <h2 id="montar-titulo" class="text-lg font-black text-gray-800 uppercase italic text-center"></h2>
            <p class="text-red-600 font-bold text-[10px] uppercase text-center mb-6">Marmita Mista (3 carnes ou +) tem adicional</p>
            <div class="space-y-6">
                <div><label class="text-[10px] font-black text-gray-400 uppercase mb-2 block tracking-widest text-center">Carnes</label><div class="grid grid-cols-2 gap-3" id="container-carnes"></div></div>
                <div><label class="text-[10px] font-black text-gray-400 uppercase mb-2 block tracking-widest text-center">Acompanhamentos</label><div class="grid grid-cols-2 gap-3" id="container-acomps"></div></div>
                <div class="pt-4 border-t text-center">
                    <p id="aviso-extra" class="text-[11px] text-red-600 font-black mb-2 hidden">⚠️ ADICIONAL DE CARNE MISTA ATIVADO!</p>
                    <div id="resumo" class="bg-gray-50 p-4 rounded-2xl text-[10px] font-bold text-gray-500 italic"></div>
                </div>
                <textarea id="montar-obs" placeholder="Alguma observação?" class="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl outline-none text-sm h-16 italic"></textarea>
            </div>
            <button onclick="confirmar()" class="w-full bg-green-500 text-white py-5 rounded-3xl font-black text-lg mt-6 shadow-xl">ADICIONAR</button>
            <button onclick="fechar()" class="w-full text-gray-400 mt-4 text-[10px] font-black uppercase">Cancelar</button>
        </div>
    </div>

    <div id="carrinho-view" class="fixed inset-0 bg-black bg-opacity-60 z-[60] hidden">
        <div class="absolute right-0 top-0 w-full max-w-[300px] h-full bg-white flex flex-col shadow-2xl">
            <div class="p-6 bg-red-600 text-white flex justify-between items-center shadow-md">
                <h2 class="font-bold uppercase italic">Carrinho</h2>
                <button onclick="toggleCarrinho()" class="text-3xl">&times;</button>
            </div>
            <div id="itens-carrinho" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-6 border-t bg-gray-50">
                <div class="flex justify-between mb-4"><span class="font-bold text-gray-400 text-xs">Total</span><span id="total" class="text-xl font-black text-red-600 font-mono">R$ 0,00</span></div>
                <button id="btn-finalizar-pedido" onclick="abrirCadastro()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-black shadow-lg">FINALIZAR PEDIDO</button>
            </div>
        </div>
    </div>

    <div id="modal-cadastro" class="fixed inset-0 bg-black bg-opacity-80 z-[120] items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl text-center">
            <h2 class="text-2xl font-black mb-6 uppercase italic">Checkout</h2>
            <div class="space-y-4">
                <input type="text" id="nome" placeholder="Seu Nome" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 outline-none">
                <input type="text" id="endereco" placeholder="Endereço e Número" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 outline-none">
                <select id="bairro-select" class="w-full bg-gray-100 p-4 rounded-2xl border-none font-bold text-gray-700"></select>
                
                <select id="pagamento-select" onchange="verificarDinheiro(this.value)" class="w-full bg-red-50 p-4 rounded-2xl border-none font-bold text-red-600">
                    <option value="">Forma de Pagamento</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                </select>

                <input type="text" id="troco-input" placeholder="Troco para quanto?" class="w-full bg-yellow-50 p-4 rounded-2xl border-2 border-yellow-200 outline-none hidden">

                <input type="tel" id="whatsapp" placeholder="WhatsApp" class="w-full bg-gray-100 p-4 rounded-2xl outline-none">
            </div>
            <button onclick="enviarWhatsApp()" class="w-full bg-green-500 text-white py-5 rounded-3xl font-black text-lg mt-8">ENVIAR NO WHATSAPP</button>
            <button onclick="fecharCadastro()" class="w-full text-gray-400 mt-4 text-[10px] font-black uppercase">Voltar</button>
        </div>
    </div>

    <div id="modal-cardapio" class="fixed inset-0 bg-black bg-opacity-95 z-[100] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[40px] p-8 overflow-y-auto max-h-[80vh]">
            <h3 class="text-red-600 font-black text-xl mb-4 text-center italic border-b pb-2 uppercase">Menu de Hoje</h3>
            <div id="texto-cardapio-view" class="text-gray-700 text-lg font-semibold text-center italic space-y-4"></div>
            <button onclick="fecharCardapio()" class="w-full mt-8 bg-gray-100 py-3 rounded-xl font-bold text-gray-400 uppercase text-xs">Voltar</button>
        </div>
    </div>

    <a href="admin.html" class="fixed bottom-4 left-4 bg-gray-800 text-white px-3 py-2 rounded-full text-[10px] font-bold opacity-30 hover:opacity-100 z-[200] flex items-center gap-2">
        <i class="fas fa-cog"></i> ADMIN
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFfzdiaiNhDLilNUVG_o3LnX2U0ZQmrys",
            authDomain: "pdvcaixa-8c17e.firebaseapp.com",
            databaseURL: "https://pdvcaixa-8c17e-default-rtdb.firebaseio.com",
            projectId: "pdvcaixa-8c17e",
            storageBucket: "pdvcaixa-8c17e.firebasestorage.app",
            messagingSenderId: "394102472085",
            appId: "1:394102472085:web:3462ffc38d4b94723aca9c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let carrinho = [], config = {}, selCarnes = [], selAcomps = [], baseMarmita = { nome: "", preco: 0 };

        onValue(ref(db, 'config'), (snap) => {
            config = snap.val() || {};
            const bSelect = document.getElementById('bairro-select');
            bSelect.innerHTML = '<option value="">Selecione seu Bairro</option>';
            (config.taxas_entrega || "").split('\n').filter(l => l.includes('-')).forEach(l => {
                const p = l.split('-');
                bSelect.innerHTML += `<option value="${p[1].trim()}" data-nome="${p[0].trim()}">${p[0].trim()} (Taxa: R$ ${p[1].trim()})</option>`;
            });

            // CORREÇÃO APLICADA AQUI:
            const containerCardapio = document.getElementById('texto-cardapio-view');
            containerCardapio.innerHTML = `
                <div class="mb-4 text-sm"><strong>Carnes:</strong><br>${(config.carnes || "").replace(/\n/g, '<br>')}</div>
                <div class="text-sm"><strong>Acompanhamentos:</strong><br>${(config.acompanhamentos || "").replace(/\n/g, '<br>')}</div>
            `;
            
            const btnFim = document.getElementById('btn-finalizar-pedido');
            const listaP = document.getElementById('lista-produtos');
            if (config.loja_aberta === false) {
                if(btnFim) { btnFim.disabled = true; btnFim.classList.replace('bg-green-500', 'bg-gray-400'); btnFim.innerText = "LOJA FECHADA"; }
                if(listaP) listaP.style.opacity = "0.4";
            } else {
                if(btnFim) { btnFim.disabled = false; btnFim.classList.replace('bg-gray-400', 'bg-green-500'); btnFim.innerText = "FINALIZAR PEDIDO"; }
                if(listaP) listaP.style.opacity = "1";
            }

            carregarProdutos();
        });

        window.verificarDinheiro = (val) => {
            const troco = document.getElementById('troco-input');
            if(val === "Dinheiro") troco.classList.remove('hidden');
            else troco.classList.add('hidden');
        };

        function carregarProdutos() {
            onValue(ref(db, 'produtos'), (snap) => {
                const data = snap.val();
                const container = document.getElementById('lista-produtos');
                container.innerHTML = "";
                const feiAtiva = (config.forcar_feijoada || new Date().getDay() === 6);
                for (let id in data) {
                    const p = data[id];
                    const n = (p.nome || "").toLowerCase();
                    
                    if (n.includes("buffet") || n.includes("vidro") || n.includes("prato feito") || n.includes(" pf")) continue;
                    
                    if (feiAtiva) { if (n.includes("marmitex") && !n.includes("feijoada")) continue; }
                    else { if (n.includes("feijoada")) continue; }
                    const isMarmita = n.includes("marmita") || n.includes("marmitex");
                    const acao = config.loja_aberta ? (isMarmita ? `abrirMontagem('${p.nome}', ${p.preco})` : `addDireto('${p.nome}', ${p.preco})`) : `alert('Estamos fechados!')`;
                    container.innerHTML += `<div class="product-card flex flex-col shadow-sm text-center"><img src="${p.foto || 'https://via.placeholder.com/150'}" class="h-24 w-full object-cover"><div class="p-3"><h3 class="text-[9px] font-black uppercase h-8 leading-tight">${p.nome}</h3><p class="text-red-600 font-black text-sm italic">R$ ${p.preco.toFixed(2)}</p><button onclick="${acao}" class="w-full bg-red-600 text-white py-2 rounded-xl text-[9px] font-black uppercase mt-2">${isMarmita ? 'MONTAR' : 'ADICIONAR'}</button></div></div>`;
                }
            }, { onlyOnce: true });
        }

        window.abrirMontagem = (nome, preco) => {
            baseMarmita = { nome, preco }; selCarnes = []; selAcomps = [];
            const render = (texto, tipo) => {
                let h = "";
                texto.split('\n').filter(l => l.trim().length > 1).forEach((l, i) => {
                    h += `<div class="item-box ${tipo}-box" id="${tipo}-${i}"><p class="text-[9px] font-bold uppercase h-6 flex items-center justify-center leading-tight">${l.trim()}</p><button onclick="toggle('${l.trim()}', '${tipo}', ${i})" class="btn-add">ADD</button></div>`;
                });
                return h;
            };
            document.getElementById('container-carnes').innerHTML = render(config.carnes || "", "carne");
            document.getElementById('container-acomps').innerHTML = render(config.acompanhamentos || "", "acomp");
            document.getElementById('modal-montar').style.display = 'flex';
            document.getElementById('montar-titulo').innerText = nome;
            atualizarResumo();
        };

        window.toggle = (item, tipo, i) => {
            const el = document.getElementById(`${tipo}-${i}`);
            const lower = item.toLowerCase();
            if (lower.includes("arroz") || lower.includes("feijão") || lower.includes("feijao")) {
                const cat = lower.includes("arroz") ? "arroz" : "feijao";
                selAcomps = selAcomps.filter(x => !x.toLowerCase().includes(cat));
                document.querySelectorAll('.acomp-box').forEach(card => { if(card.innerText.toLowerCase().includes(cat)) card.classList.remove('selecionado'); });
            }
            if (tipo === 'carne') {
                if (selCarnes.includes(item)) selCarnes = selCarnes.filter(x => x !== item); else selCarnes.push(item);
            } else {
                if (selAcomps.includes(item)) selAcomps = selAcomps.filter(x => x !== item); else selAcomps.push(item);
            }
            el.classList.toggle('selecionado');
            atualizarResumo();
        };

        function atualizarResumo() {
            const isExtra = selCarnes.length >= 3;
            document.getElementById('aviso-extra').classList.toggle('hidden', !isExtra);
            document.getElementById('resumo').innerText = [...selCarnes, ...selAcomps].join(' + ') || "Escolha os itens...";
        }

        window.confirmar = () => {
            if(selCarnes.length === 0 && selAcomps.length === 0) return alert("Monte sua marmita!");
            let precoF = baseMarmita.preco;
            let infoE = "";
            if (selCarnes.length >= 3) { precoF += parseFloat(config.valor_carne_extra) || 0; infoE = " (Mista +Adicional)"; }
            carrinho.push({ nome: { tipo: baseMarmita.nome, carnes: selCarnes.join(', '), acomps: selAcomps.join(', '), obs: document.getElementById('montar-obs').value, extra: infoE }, preco: precoF, isMarmita: true });
            atualizarInterface();
            fechar();
        };

        window.atualizarInterface = () => {
            document.getElementById('cart-count').innerText = carrinho.length;
            let html = "", t = 0;
            carrinho.forEach((item, i) => { t += item.preco; const n = item.isMarmita ? `${item.nome.tipo} Personalizada` : item.nome; html += `<div class="bg-gray-50 p-3 rounded-xl border text-[8px] font-bold">${n} <br> <span class="text-red-600 font-mono">R$ ${item.preco.toFixed(2)}</span><button onclick="remover(${i})" class="float-right text-gray-300"><i class="fas fa-trash"></i></button></div>`; });
            document.getElementById('total').innerText = `R$ ${t.toFixed(2)}`;
            document.getElementById('itens-carrinho').innerHTML = html;
        };

        window.enviarWhatsApp = () => {
            const n = document.getElementById('nome').value, e = document.getElementById('endereco').value, w = document.getElementById('whatsapp').value;
            const b = document.getElementById('bairro-select'), p = document.getElementById('pagamento-select'), troco = document.getElementById('troco-input').value;
            const bairroNome = b.options[b.selectedIndex]?.getAttribute('data-nome');
            const taxaValor = parseFloat(b.value) || 0;
            if(!n || !e || !w || !b.value || !p.value) return alert("Preencha todos os dados!");
            
            let tPedido = 0;
            let msg = `*♨️ NOVO PEDIDO - RESTAURANTE VITÓRIA*\n------------------------------------------\n`;
            msg += `👤 *CLIENTE:* ${n.toUpperCase()}\n📍 *ENDEREÇO:* ${e.toUpperCase()}\n🏘️ *BAIRRO:* ${bairroNome.toUpperCase()}\n💳 *PAGAMENTO:* ${p.value.toUpperCase()}\n`;
            if(p.value === "Dinheiro") msg += `💵 *TROCO PARA:* ${troco || 'Não informado'}\n`;
            msg += `📱 *CONTATO:* ${w}\n------------------------------------------\n\n🛒 *ITENS:*\n\n`;
            carrinho.forEach((i, idx) => {
                if(i.isMarmita) { msg += `*${idx + 1}. ${i.nome.tipo.toUpperCase()}* ${i.nome.extra}\n🥩 _Carnes:_ ${i.nome.carnes}\n🍚 _Acomps:_ ${i.nome.acomps}\n${i.nome.obs ? '⚠️ _Obs:_ ' + i.nome.obs + '\n' : ''}`; }
                else { msg += `*${idx + 1}. ${i.nome.toUpperCase()}*\n`; }
                msg += `💰 R$ ${i.preco.toFixed(2)}\n\n`;
                tPedido += i.preco;
            });
            msg += `------------------------------------------\n🍲 *SUBTOTAL:* R$ ${tPedido.toFixed(2)}\n🛵 *TAXA ENTREGA:* R$ ${taxaValor.toFixed(2)}\n✅ *TOTAL GERAL: R$ ${(tPedido + taxaValor).toFixed(2)}*`;
            window.open(`https://api.whatsapp.com/send?phone=5541991399766&text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.addDireto = (n, p) => { carrinho.push({ nome: n, preco: p, isMarmita: false }); atualizarInterface(); toggleCarrinho(); };
        window.toggleCarrinho = () => document.getElementById('carrinho-view').classList.toggle('hidden');
        window.remover = (i) => { carrinho.splice(i, 1); atualizarInterface(); };
        window.fechar = () => document.getElementById('modal-montar').style.display = 'none';
        window.abrirCardapio = () => document.getElementById('modal-cardapio').style.display = 'flex';
        window.fecharCardapio = () => document.getElementById('modal-cardapio').style.display = 'none';
        window.abrirCadastro = () => { if(carrinho.length > 0) document.getElementById('modal-cadastro').style.display = 'flex'; };
        window.fecharCadastro = () => document.getElementById('modal-cadastro').style.display = 'none';
    </script>
</body>
</html>
